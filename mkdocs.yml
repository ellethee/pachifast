# The documentation is plain markdown in docs/ (readable on GitHub as it is) and also builds into a static
# site: `uv run --group docs mkdocs build --strict` (or `mkdocs serve` to preview).
# DOCS_SITE_URL is the public address of the site (for example GitHub Pages); the documentation workflow sets it.
site_name: pachifast
site_description: Modular FastAPI framework with a scaffolding CLI, authentication and migrations.
site_url: !ENV [DOCS_SITE_URL, ""]
docs_dir: docs
# the version in the footer and on the home page comes from pyproject.toml
hooks:
  - scripts/mkdocs_hooks.py
theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Configuration: guides/configuration.md
      - Modules: guides/modules.md
      - Authentication: guides/authentication.md
      - Model admin: guides/model-admin.md
      - Extending the core: guides/extending.md
      - Routing and responses: guides/routing-and-responses.md
      - Errors and i18n: guides/errors-and-i18n.md
      - Events and activity log: guides/events.md
      - Cache: guides/cache.md
      - Database and migrations: guides/database-and-migrations.md
      - Operations: guides/operations.md
      - Deployment: guides/deployment.md
      - Publishing: guides/publishing.md
      - Frontend integration: guides/frontend-integration.md
      - Stability and support: guides/stability.md
      - Upgrading: guides/upgrading.md
  - Reference:
      - CLI: reference/cli.md
      - Settings: reference/settings.md
      - Message codes: reference/error-codes.md
  - Contributing: contributing.md
  - Changelog: changelog.md
