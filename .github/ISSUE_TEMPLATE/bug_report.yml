name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal example or the commands you ran.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pachifast version
      placeholder: "0.15.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: "Python 3.12, Ubuntu 24.04"
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: text
