# Builds pachifast and publishes it to PyPI with Trusted Publishing (no token stored anywhere).
#
# Runs when a tag `vX.Y.Z` is pushed (the tag must match `version` in pyproject.toml). By hand ("Run workflow") it
# builds and checks the package and uploads it to TestPyPI instead. One-time setup:
#   1. pypi.org and test.pypi.org > Your projects > Publishing: add a trusted publisher (owner ellethee, repository
#      pachifast, workflow publish-pypi.yml, environment `pypi` / `testpypi`).
#   2. Repository Settings > Environments: create `pypi` (add a required reviewer: it is the last gate) and `testpypi`.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Check that the tag matches the version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          VERSION="$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${VERSION} in pyproject.toml" >&2
            exit 1
          fi
      - name: Lint and test
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run pytest -q
      - name: Build the sdist and the wheel
        run: uv build --out-dir dist
      - name: Check the metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - run: uv publish --trusted-publishing always dist/*

  publish-testpypi:
    needs: build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ dist/*
