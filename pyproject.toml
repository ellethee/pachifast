[project]
name = "pachifast"
version = "0.15.0"
description = "Modular FastAPI core and scaffolding CLI: projects, apps, auth, migrations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ilPachi" }]
maintainers = [{ name = "ilPachi" }]
requires-python = ">=3.11"
keywords = ["fastapi", "scaffolding", "cli", "sqlalchemy", "alembic", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "fastapi[standard]>=0.115.14,<1.0.0",
    "fastapi-pagination>=0.13.0,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.7.1,<3.0.0",
    "PyJWT>=2.9.0,<3.0.0",
    "PyYAML>=6.0",
    "pwdlib[argon2]>=0.2.1",
    "alembic>=1.14.1,<2.0.0",
    "sqlalchemy[asyncio]>=2.0.40,<3.0.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.22",
    "cryptography>=43.0.0",
    "packaging>=23.0",
    "pyotp>=2.9.0,<3.0.0",
    "typer>=0.15.0,<1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30.0,<0.32.0"]
postgres-sync = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0.0"]

[project.urls]
Homepage = "https://pachifast.ilpachi.it/"
Documentation = "https://pachifast.ilpachi.it/"
Repository = "https://github.com/ellethee/pachifast"
Source = "https://github.com/ellethee/pachifast"
Issues = "https://github.com/ellethee/pachifast/issues"
Changelog = "https://github.com/ellethee/pachifast/blob/main/CHANGELOG.md"

[project.scripts]
pachifast = "pachifast.cli:app"

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
]
dev = [
    "asyncpg>=0.30.0,<0.32.0",
    "psycopg[binary]>=3.2",
    "fakeredis>=2.39.0",
    "httpx>=0.27.0",
    "jsonschema>=4.26.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/README.it.md", "/LICENSE", "/CHANGELOG.md", "/examples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pachifast"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy runs the code after the first await in greenlets and threads: without this the numbers are far too low
concurrency = ["greenlet", "thread"]
source = ["pachifast"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Alembic revisions are generated code.
extend-exclude = ["examples/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: FastAPI usa Depends() come default degli argomenti.
ignore = ["B008", "UP042"]  # UP042: the str-mixin enums are part of the public API
